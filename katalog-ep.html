<!DOCTYPE html>
<html lang="sk" class="govuk-template">
<head>
  <meta charset="utf-8">
  <title>Katalóg edukačných publikácií — Katalógy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0c">
  <link rel="icon" sizes="48x48" href="idsk/assets/images/favicon.ico">
  <link rel="icon" sizes="any" href="idsk/assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="idsk/frontend.min.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body class="govuk-template__body">
  <script>document.body.className += ' js-enabled' + ('noModule' in HTMLScriptElement.prototype ? ' govuk-frontend-supported' : '');</script>

  <div id="app-header"></div>

  <div class="govuk-width-container">
    <div class="govuk-breadcrumbs">
      <ol class="govuk-breadcrumbs__list">
        <li class="govuk-breadcrumbs__list-item">
          <a class="govuk-breadcrumbs__link" href="index.html">Úvod</a>
        </li>
        <li class="govuk-breadcrumbs__list-item">
          <a class="govuk-breadcrumbs__link" href="katalog-ep.html">Katalóg edukačných publikácií</a>
        </li>
      </ol>
    </div>

    <main class="govuk-main-wrapper" id="main-content">
      <h1 class="govuk-heading-l">Katalóg edukačných publikácií</h1>

      <div class="app-toolbar">
        <div class="app-search" role="search">
          <span class="material-icons app-search__icon" aria-hidden="true">search</span>
          <input class="govuk-input" type="search" id="app-search" aria-label="Hľadať publikáciu" title="Zadajte hľadaný výraz">
        </div>
        <button type="button" class="govuk-button govuk-button--sec" id="app-filter-toggle" aria-expanded="true" aria-controls="app-filter-panel">
          <span class="material-icons" aria-hidden="true">filter_list</span>Filter
        </button>
        <span class="app-toolbar__sort govuk-body-s">
          Triediť podľa:
          <select class="govuk-select" id="app-sort" aria-label="Triediť podľa"></select>
        </span>
        <span class="app-toolbar__spacer"></span>
        <button type="button" class="govuk-button govuk-button--sec" id="app-export">
          Export<span class="material-icons" aria-hidden="true">expand_more</span>
        </button>
      </div>

      <div class="app-filter-panel" id="app-filter-panel">
        <h3 class="govuk-heading-s app-filter-panel__title">Základné filtre</h3>
        <div class="app-filters" id="app-filters"></div>
      </div>

      <p class="govuk-body-s app-count" id="app-count" aria-live="polite"></p>

      <div class="app-results" id="app-results"></div>
    </main>
  </div>

  <div id="app-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/catalog.js"></script>
  <script type="module" src="js/common.js"></script>
  <script>
    // Zoznamy hodnôt zodpovedajú SELECT poliam vo formulári edukačnej publikácie
    const EP_OPTIONS = {
      druh: [
        'Učebnica', 'Pracovná učebnica', 'Pracovný zošit', 'Učebný text',
        'Preklad EP - Učebnica', 'Preklad EP - Pracovná učebnica',
        'Preklad EP - Pracovný zošit', 'Preklad EP - Učebný text',
        'Špeciálna EP - Učebnica', 'Špeciálna EP - Pracovná učebnica',
        'Špeciálna EP - Pracovný zošit', 'Špeciálna EP - Učebný text',
        'Špeciálna EP preklad - Učebnica', 'Špeciálna EP preklad - Pracovná učebnica',
        'Špeciálna EP preklad - Pracovný zošit', 'Špeciálna EP preklad - Učebný text'
      ],
      verzia_vyhotovenia: ['Tlačená a elektronická', 'Elektronická', 'Tlačená'],
      verzia_posudok: ['Vydaná', 'Zalomená predtlačová verzia', 'Autorsky/redakčne spracovaný rukopis'],
      posudzovanie: ['A', 'B'],
      rok_vydania: [
        '2030', '2029', '2028', '2027', '2026', '2025', '2024', '2023', '2022',
        '2021', '2019', '2018', '2017', '2016', '2015', '2014', '2013', '2012', '2011', '2010'
      ],
      poradie: ['1', '2'],
      vazba: ['pevná', 'paperback'],
      jazyk: [
        'slovenský', 'maďarský', 'nemecký', 'ukrajinský', 'rusínsky', 'rómsky',
        'anglický', 'španielsky', 'taliansky', 'francúzky', 'ruský'
      ]
    };

    function epFilter(key, label) {
      return {
        key: key,
        label: label,
        options: EP_OPTIONS[key],
        getValue: function (x) { return x[key]; }
      };
    }

    initCatalog({
      name: 'katalog-ep',
      searchFields: ['nazov', 'nazov_statny_jazyk', 'druh', 'jazyk', 'isbn_tlacena', 'isbn_elektronicka'],
      filters: [
        epFilter('druh', 'Druh EP'),
        epFilter('verzia_vyhotovenia', 'Verzia vyhotovenia EP'),
        epFilter('verzia_posudok', 'Verzia EP na posúdenie'),
        epFilter('posudzovanie', 'Postup posudzovania EP'),
        epFilter('rok_vydania', 'Rok vydania EP'),
        epFilter('poradie', 'Poradie vydania'),
        epFilter('vazba', 'Väzba EP'),
        epFilter('jazyk', 'Jazyk EP')
      ],
      sorts: [
        { key: 'newest', label: 'Najnovšie', compare: function (a, b) { return (b.rok_vydania || 0) - (a.rok_vydania || 0); } },
        { key: 'oldest', label: 'Najstaršie', compare: function (a, b) { return (a.rok_vydania || 0) - (b.rok_vydania || 0); } },
        { key: 'name', label: 'Názov A–Z', compare: function (a, b) { return String(a.nazov).localeCompare(String(b.nazov), 'sk'); } }
      ],
      csvColumns: ['id', 'nazov', 'druh', 'rok_vydania', 'jazyk', 'isbn_tlacena', 'isbn_elektronicka', 'verzia_vyhotovenia', 'verzia_posudok', 'poradie', 'vazba', 'posudzovanie', 'suma'],
      renderItem: function (item) {
        return '<article class="app-result">' +
          '<h3 class="app-result__title"><a class="govuk-link" href="detail-ep.html?id=' + encodeURIComponent(item.id) + '">' + esc(item.nazov) + '</a></h3>' +
          '<p class="app-meta">' +
            metaItem('menu_book', item.druh) +
            metaItem('calendar_today', item.rok_vydania) +
          '</p>' +
        '</article>';
      }
    });
  </script>
</body>
</html>
