name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Každý deň o 03:00 UTC — obnoví snapshot dát z API
    - cron: '0 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Refresh data snapshot from API
        env:
          KATALOG_API_TOKEN: ${{ secrets.KATALOG_API_TOKEN }}
        run: |
          if [ -n "$KATALOG_API_TOKEN" ]; then
            node scripts/fetch-data.mjs || echo "::warning::Nepodarilo sa obnoviť dáta, použije sa commitnutý snapshot"
          else
            echo "KATALOG_API_TOKEN nie je nastavený — použije sa commitnutý snapshot"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
