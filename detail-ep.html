<!DOCTYPE html>
<html lang="sk" class="govuk-template">
<head>
  <meta charset="utf-8">
  <title>Detail publikácie — Katalógy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0c">
  <link rel="icon" sizes="48x48" href="idsk/assets/images/favicon.ico">
  <link rel="icon" sizes="any" href="idsk/assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="idsk/frontend.min.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body class="govuk-template__body">
  <script>document.body.className += ' js-enabled' + ('noModule' in HTMLScriptElement.prototype ? ' govuk-frontend-supported' : '');</script>

  <div id="app-header"></div>

  <div class="govuk-width-container">
    <div class="govuk-breadcrumbs">
      <ol class="govuk-breadcrumbs__list">
        <li class="govuk-breadcrumbs__list-item">
          <a class="govuk-breadcrumbs__link" href="index.html">Úvod</a>
        </li>
        <li class="govuk-breadcrumbs__list-item">
          <a class="govuk-breadcrumbs__link" href="katalog-ep.html">Katalóg edukačných publikácií</a>
        </li>
        <li class="govuk-breadcrumbs__list-item" id="app-breadcrumb-current"></li>
      </ol>
    </div>

    <main class="govuk-main-wrapper" id="main-content">
      <a class="govuk-link app-back-link" href="katalog-ep.html">
        <span class="material-icons" aria-hidden="true">west</span>Späť na katalóg
      </a>
      <div id="app-detail"><p class="govuk-body">Načítava sa…</p></div>
    </main>
  </div>

  <div id="app-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/catalog.js"></script>
  <script type="module" src="js/common.js"></script>
  <script>
    (function () {
      const id = new URLSearchParams(location.search).get('id');
      const el = document.getElementById('app-detail');

      function row(label, value) {
        if (value == null || value === '') return '';
        return '<tr class="govuk-table__row">' +
          '<th scope="row" class="govuk-table__header">' + label + '</th>' +
          '<td class="govuk-table__cell">' + esc(value) + '</td></tr>';
      }

      loadItem('katalog-ep', id).then(function (item) {
        if (!item) {
          el.innerHTML = '<p class="govuk-body">Publikácia sa nenašla.</p>';
          return;
        }
        document.title = item.nazov + ' — Katalógy';
        document.getElementById('app-breadcrumb-current').textContent = item.nazov;

        const autori = (item.autor || []).map(function (a) {
          return esc(a.meno) +
            (a.email ? ' · <a class="govuk-link" href="mailto:' + esc(a.email) + '">' + esc(a.email) + '</a>' : '') +
            (a.tel ? ' · ' + esc(a.tel) : '');
        }).join('<br>');

        el.innerHTML =
          '<h1 class="govuk-heading-l">' + esc(item.nazov) + '</h1>' +
          '<p class="app-chips">' +
            chip(item.druh) + chip(item.jazyk) + chip(item.verzia_posudok) +
          '</p>' +
          (item.popis ? '<p class="govuk-body">' + esc(item.popis) + '</p>' : '') +
          '<table class="govuk-table app-detail-table">' +
            '<caption class="govuk-table__caption govuk-heading-s">Údaje o publikácii</caption>' +
            '<tbody class="govuk-table__body">' +
              row('Názov', item.nazov) +
              row('Názov v štátnom jazyku', item.nazov_statny_jazyk) +
              row('Druh publikácie', item.druh) +
              row('Jazyk', item.jazyk) +
              row('Rok vydania', item.rok_vydania) +
              row('Poradie vydania', item.poradie) +
              row('Verzia vyhotovenia', item.verzia_vyhotovenia) +
              row('Stav posúdenia', item.verzia_posudok) +
              row('Posudzovanie', item.posudzovanie) +
              row('Väzba', item.vazba) +
              row('Formát', item.format) +
              row('ISBN (tlačená verzia)', item.isbn_tlacena) +
              row('ISBN (elektronická verzia)', item.isbn_elektronicka) +
              row('Suma', item.suma != null ? item.suma + ' €' : null) +
            '</tbody>' +
          '</table>' +
          (autori
            ? '<h2 class="govuk-heading-s">Autori</h2><p class="govuk-body">' + autori + '</p>'
            : '');
      }).catch(function (err) {
        el.innerHTML = '<p class="govuk-body">Dáta sa nepodarilo načítať. (' + esc(err.message) + ')</p>';
      });
    })();
  </script>
</body>
</html>
