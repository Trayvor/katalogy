<!DOCTYPE html>
<html lang="sk" class="govuk-template">
<head>
  <meta charset="utf-8">
  <title>Detail publikácie — Katalógy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0c">
  <link rel="icon" sizes="48x48" href="idsk/assets/images/favicon.ico">
  <link rel="icon" sizes="any" href="idsk/assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="idsk/frontend.min.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body class="govuk-template__body">
  <script>document.body.className += ' js-enabled' + ('noModule' in HTMLScriptElement.prototype ? ' govuk-frontend-supported' : '');</script>
  <a class="app-skip-link" href="#main-content" data-i18n>Preskočiť na hlavný obsah</a>

  <div id="app-header"></div>

  <div class="govuk-width-container">
    <nav class="govuk-breadcrumbs" aria-label="Navigácia">
      <ol class="govuk-breadcrumbs__list">
        <li class="govuk-breadcrumbs__list-item">
          <a class="govuk-breadcrumbs__link" href="index.html" data-i18n>Úvod</a>
        </li>
        <li class="govuk-breadcrumbs__list-item">
          <a class="govuk-breadcrumbs__link" href="katalog-ep.html" data-i18n>Katalóg edukačných publikácií</a>
        </li>
        <li class="govuk-breadcrumbs__list-item" id="app-breadcrumb-current" aria-current="page"></li>
      </ol>
    </nav>

    <main class="govuk-main-wrapper" id="main-content">
      <a class="govuk-link app-back-link" href="katalog-ep.html">
        <span class="material-icons" aria-hidden="true">west</span><span data-i18n>Späť na katalóg</span>
      </a>
      <div id="app-detail"><p class="govuk-body" data-i18n>Načítava sa…</p></div>
    </main>
  </div>

  <div id="app-footer"></div>

  <script src="js/i18n.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/catalog.js"></script>
  <script type="module" src="js/common.js"></script>
  <script>
    (function () {
      const id = new URLSearchParams(location.search).get('id');
      const el = document.getElementById('app-detail');

      // Jeden riadok karty: popisok vľavo, hodnota vpravo
      function row(label, valueHtml) {
        if (valueHtml == null || valueHtml === '') return '';
        return '<div class="app-detail-row">' +
          '<span class="app-detail-row__label">' + esc(t(label)) + '</span>' +
          '<span class="app-detail-row__value">' + valueHtml + '</span></div>';
      }

      loadItem('katalog-ep', id).then(function (item) {
        if (!item) {
          el.innerHTML = '<p class="govuk-body">' + t('Publikácia sa nenašla.') + '</p>';
          return;
        }
        document.title = item.nazov + ' — ' + t('Katalógy');
        document.getElementById('app-breadcrumb-current').textContent = item.nazov;

        // Autori ako "pilulky" — iba meno a priezvisko
        const autori = (item.autor || []).map(function (a) {
          return '<span class="app-pill">' + esc(a.meno) + '</span>';
        }).join('');

        el.innerHTML =
          '<h1 class="govuk-heading-l">' + esc(item.nazov) + '</h1>' +
          '<section class="app-detail-card" aria-label="' + t('O publikácií') + '">' +
            '<h2 class="govuk-heading-s app-detail-card__title">' + t('O publikácií') + '</h2>' +
            row('ID edukačnej publikácie', esc(item.id)) +
            row('Názov edukačnej publikácie', esc(item.nazov)) +
            row('Autor/autori EP', autori ? '<span class="app-pills">' + autori + '</span>' : '') +
            row('Druh EP', esc(item.druh)) +
            row('Verzia vyhotovenia EP', esc(item.verzia_vyhotovenia)) +
            row('Verzia EP predložená na posúdenie', esc(item.verzia_posudok)) +
            row('Postup posudzovania EP', esc(item.posudzovanie)) +
            row('Rok vydania', esc(item.rok_vydania)) +
            row('Poradie vydania', esc(item.poradie)) +
            row('Väzba EP', esc(item.vazba)) +
            row('Formát EP', esc(item.format)) +
            row('ISBN - tlačená verzia', esc(item.isbn_tlacena)) +
            row('ISBN - elektronická verzia', esc(item.isbn_elektronicka)) +
            row('Jazyk EP', esc(item.jazyk)) +
            row('Názov EP v štátnom jazyku', esc(item.nazov_statny_jazyk)) +
            row('Indikatívna cena EP (s DPH)', item.suma != null && item.suma !== '' ? esc(item.suma) + ' €' : '') +
          '</section>';
      }).catch(function (err) {
        el.innerHTML = '<p class="govuk-body">' + t('Dáta sa nepodarilo načítať.') + ' (' + esc(err.message) + ')</p>';
      });
    })();
  </script>
</body>
</html>
