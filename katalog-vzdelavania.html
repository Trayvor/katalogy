<!DOCTYPE html>
<html lang="sk" class="govuk-template">
<head>
  <meta charset="utf-8">
  <title>Katalóg vzdelávania v profesijnom rozvoji — Katalógy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0c">
  <link rel="icon" sizes="48x48" href="idsk/assets/images/favicon.ico">
  <link rel="icon" sizes="any" href="idsk/assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="idsk/frontend.min.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body class="govuk-template__body">
  <script>document.body.className += ' js-enabled' + ('noModule' in HTMLScriptElement.prototype ? ' govuk-frontend-supported' : '');</script>

  <div id="app-header"></div>

  <div class="govuk-width-container">
    <div class="govuk-breadcrumbs">
      <ol class="govuk-breadcrumbs__list">
        <li class="govuk-breadcrumbs__list-item">
          <a class="govuk-breadcrumbs__link" href="index.html">Úvod</a>
        </li>
        <li class="govuk-breadcrumbs__list-item">
          <a class="govuk-breadcrumbs__link" href="katalog-vzdelavania.html">Katalóg vzdelávania v profesijnom rozvoji</a>
        </li>
      </ol>
    </div>

    <main class="govuk-main-wrapper" id="main-content">
      <h1 class="govuk-heading-l">Katalóg vzdelávania v profesijnom rozvoji</h1>

      <div class="app-toolbar">
        <div class="app-search" role="search">
          <span class="material-icons app-search__icon" aria-hidden="true">search</span>
          <input class="govuk-input" type="search" id="app-search" aria-label="Hľadať vzdelávanie" title="Zadajte hľadaný výraz">
        </div>
        <button type="button" class="govuk-button govuk-button--sec" id="app-filter-toggle" aria-expanded="true" aria-controls="app-filter-panel">
          <span class="material-icons" aria-hidden="true">filter_list</span>Filter
        </button>
        <span class="app-toolbar__sort govuk-body-s">
          Triediť podľa:
          <select class="govuk-select" id="app-sort" aria-label="Triediť podľa"></select>
        </span>
        <span class="app-toolbar__spacer"></span>
        <button type="button" class="govuk-button govuk-button--sec" id="app-export">
          Export<span class="material-icons" aria-hidden="true">expand_more</span>
        </button>
      </div>

      <div class="app-filter-panel" id="app-filter-panel">
        <h3 class="govuk-heading-s app-filter-panel__title">Základné filtre</h3>
        <div class="app-filters" id="app-filters"></div>
      </div>

      <p class="govuk-body-s app-count" id="app-count" aria-live="polite"></p>

      <div class="app-results" id="app-results"></div>
    </main>
  </div>

  <div id="app-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/catalog.js"></script>
  <script type="module" src="js/common.js"></script>
  <script>
    initCatalog({
      name: 'katalog-vzdelavania',
      searchFields: ['nazov', 'popis', 'poskytovatel', 'druh_vzdelavania'],
      filters: [
        { key: 'druh', label: 'Druh vzdelávania', getValue: function (x) { return x.druh_vzdelavania; } },
        { key: 'poskytovatel', label: 'Poskytovateľ vzdelávania', getValue: function (x) { return x.poskytovatel; } },
        { key: 'kategoria', label: 'Kategória zamestnanca', getValue: function (x) { return x.kategoria_zamestnanca; } },
        { key: 'skola', label: 'Druh školy', getValue: function (x) { return x.druh_skoly; } }
      ],
      sorts: [
        { key: 'newest', label: 'Najnovšie', compare: function (a, b) { return Number(b.id) - Number(a.id); } },
        { key: 'rating', label: 'Hodnotenie', compare: function (a, b) { return (b.hodnotenie || 0) - (a.hodnotenie || 0); } },
        { key: 'name', label: 'Názov A–Z', compare: function (a, b) { return String(a.nazov).localeCompare(String(b.nazov), 'sk'); } },
        { key: 'hours', label: 'Rozsah hodín', compare: function (a, b) { return (b.rozsah_hodin || 0) - (a.rozsah_hodin || 0); } }
      ],
      csvColumns: ['id', 'nazov', 'druh_vzdelavania', 'poskytovatel', 'kategoria_zamestnanca', 'druh_skoly', 'rozsah_hodin', 'stav', 'hodnotenie'],
      renderItem: function (item) {
        return '<article class="app-result">' +
          '<div class="app-result__head">' +
            '<h3 class="app-result__title"><a class="govuk-link" href="detail-vzdelavania.html?id=' + encodeURIComponent(item.id) + '">' + esc(item.nazov) + '</a></h3>' +
            (item.hodnotenie != null ? '<span>' + stars(item.hodnotenie, item.pocet_hodnoteni) + '</span>' : '') +
          '</div>' +
          '<p class="govuk-body app-result__desc">' + esc(item.popis || '') + '</p>' +
          '<p class="app-meta">' +
            metaItem('person', item.poskytovatel) +
            metaItem('settings', item.stav) +
            metaItem('schedule', item.rozsah_hodin != null ? item.rozsah_hodin + ' hodín' : '') +
          '</p>' +
          '<p class="app-chips">' +
            (item.oblasti || []).map(chip).join('') +
          '</p>' +
        '</article>';
      }
    });
  </script>
</body>
</html>
